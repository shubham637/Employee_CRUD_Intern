{% extends 'base.html' %}

{% block content %}
<div style="max-width: 960px; margin: 40px auto; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; color: #2c3e50;">

    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px;">
        <h1 style="font-size: 32px; font-weight: bold;">Employee Directory</h1>
        <a href="{% url 'employee_create' %}"
           style="padding: 10px 20px; background-color: #2ecc71; color: white; text-decoration: none; border-radius: 8px; font-weight: 500; transition: background-color 0.3s;">
            + Add Employee
        </a>
    </div>

    {% if employees %}
        <div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px;">
            {% for employee in employees %}
                <div style="background: #f8f9fa; border-radius: 10px; box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06); padding: 20px; transition: transform 0.2s ease;">
                    <h3 style="margin-bottom: 10px; font-size: 20px; color: #34495e;">
                        <a href="{% url 'employee_detail' employee.pk %}"
                           style="text-decoration: none; color: inherit;">
                            {{ employee.first_name }} {{ employee.last_name }}
                        </a>
                    </h3>
                    <div style="margin-top: 15px; display: flex; justify-content: space-between;">
                        <a href="{% url 'employee_update' employee.pk %}"
                           style="color: #2980b9; text-decoration: none; font-size: 14px; border: 1px solid #2980b9; padding: 5px 10px; border-radius: 5px;">
                            Edit
                        </a>
                        <a href="{% url 'employee_delete' employee.pk %}"
                           style="color: #e74c3c; text-decoration: none; font-size: 14px; border: 1px solid #e74c3c; padding: 5px 10px; border-radius: 5px;">
                            Delete
                        </a>
                    </div>
                </div>
            {% endfor %}
        </div>
    {% else %}
        <p style="text-align: center; margin-top: 50px; font-size: 18px; color: #7f8c8d;">
            No employees found. Please add one.
        </p>
    {% endif %}

</div>
{% endblock %}
